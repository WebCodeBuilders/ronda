# Instalación en la compu principal del local:
#   docker compose up -d            → levanta la base y ronda en el puerto 3000
#   docker compose exec app npm run db:seed   → (opcional) carga la demo
# Después, desde cualquier tablet o celular del wifi: http://IP-DE-ESTA-COMPU:3000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ronda
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ronda}
      POSTGRES_DB: ronda
    volumes:
      - ronda-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ronda"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ronda:${DB_PASSWORD:-ronda}@db:5432/ronda
      SESSION_SECRET: ${SESSION_SECRET:-cambiame-por-una-clave-larga-y-secreta}
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
volumes:
  ronda-db:
