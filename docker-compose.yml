# Instalación en la compu principal del local (o en un servidor):
#   1. cp .env.example .env   y completá SESSION_SECRET y DB_PASSWORD
#   2. docker compose up -d
#   3. Abrí http://IP-DE-ESTA-COMPU:3000 y creá tu comercio.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ronda
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en el archivo .env}
      POSTGRES_DB: ronda
    volumes:
      - ronda-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ronda"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ronda:${DB_PASSWORD}@db:5432/ronda
      SESSION_SECRET: ${SESSION_SECRET:?Definí SESSION_SECRET en el archivo .env (openssl rand -base64 48)}
      PUBLIC_URL: ${PUBLIC_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      - "${PORT:-3000}:3000"
volumes:
  ronda-db:
